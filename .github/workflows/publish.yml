name: Publish merged hunt

# Runs when a hunt lands on main: regenerates READMEs, indexes and the JSON feed
# (picking up any edits made during review), then shows the LinkedIn draft.
on:
  push:
    branches: [main]
    paths: ["hunts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.render
      - name: Commit regenerated files
        run: |
          git config user.name "144threathunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hunts index feed README.md
          git diff --cached --quiet || { git commit -m "chore: regenerate indexes and feed"; git push; }
      - name: LinkedIn draft
        run: |
          ids=$(git diff --name-only HEAD~1 HEAD -- 'hunts/*/*/hunt.yml' | xargs -r grep -h '^id:' | awk '{print $2}')
          for id in $ids; do
            f="drafts/linkedin/$id.md"
            [ -f "$f" ] || continue
            { echo "## LinkedIn draft for $id"; echo; echo '```text'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
