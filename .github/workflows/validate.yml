name: Validate hunts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate all hunts
        run: python -m pipeline.validate
      - name: Check source links of changed hunts
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'hunts/*/*/hunt.yml' | xargs -r -n1 dirname | sort -u)
          if [ -n "$changed" ]; then python -m pipeline.validate --check-links $changed; else echo "no hunt changes"; fi
