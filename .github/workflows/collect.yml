name: Collect threat intel

# Polls feeds every 4 hours and stores new items on the `intel` branch,
# so the daily run starts from everything seen since yesterday.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intel-store
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check out intel branch
        run: |
          git fetch origin intel:intel 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/intel; then
            git worktree add intel intel
          else
            git worktree add --orphan -b intel intel
          fi
      - run: python -m pipeline.collect --store intel/intel.json
      - name: Save intel store
        working-directory: intel
        run: |
          git config user.name "144threathunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel.json
          git diff --cached --quiet || git commit -m "intel: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin intel
