name: Daily hunt draft

# 10:00 UTC = 5 AM Eastern (6 AM during daylight saving time).
# Opens a pull request; nothing is published until Jose merges it.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: intel-store
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      THREATHUNTER_MODEL: ${{ vars.THREATHUNTER_MODEL || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Close stale hunt drafts (older than 3 days)
        run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --label daily-hunt --state open --json number,createdAt \
            --jq ".[] | select(.createdAt < \"$cutoff\") | .number" |
            xargs -r -I{} gh pr close {} --delete-branch --comment "Closing unreviewed draft after 3 days."
      - name: Load and refresh intel store
        run: |
          git fetch origin intel:intel 2>/dev/null && git worktree add intel intel || mkdir -p intel
          python -m pipeline.collect --store intel/intel.json
      - name: Triage
        id: triage
        run: |
          set +e
          python -m pipeline.triage --store intel/intel.json --out pick.json
          code=$?
          if [ $code -eq 2 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Draft hunt
        if: steps.triage.outputs.skip != 'true'
        run: python -m pipeline.draft --pick pick.json --pr-body pr_body.md
      - name: Open pull request
        if: steps.triage.outputs.skip != 'true'
        run: |
          branch="hunt/$(date -u +%Y-%m-%d)"
          title=$(head -1 pr_body.md | sed 's/^## //')
          git config user.name "144threathunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add hunts index feed README.md drafts
          git commit -m "hunt: $title"
          git push -u origin "$branch"
          gh label create daily-hunt --color 0E8A16 --description "Agent-drafted daily hunt" 2>/dev/null || true
          gh pr create --title "$title" --body-file pr_body.md --label daily-hunt --assignee "${{ github.repository_owner }}"
