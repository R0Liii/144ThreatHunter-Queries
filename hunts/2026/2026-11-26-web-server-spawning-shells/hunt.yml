id: TH-2026-0001
title: Web server worker processes spawning shells and recon tools
date: "2026-11-26"
author: Jose (R0Liii)
status: experimental
severity: high
platforms: [defender-xdr, sentinel]
tables: [DeviceProcessEvents]
attack:
  tactics: [TA0003, TA0002, TA0007]
  techniques: [T1505.003, T1059.001, T1059.003, T1033]
threat:
  name: Web shell activity on internet-facing web servers
  cves: []
  actors: []
summary: >-
  Exploited web apps (Exchange, SharePoint, file transfer and VPN portals) usually end with a web
  shell that runs commands as the web server's worker process. This hunt finds IIS, Apache, nginx,
  Tomcat and PHP workers launching command shells, PowerShell, or common discovery and download tools.
sources:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://attack.mitre.org/techniques/T1059/
false_positives:
  - ASP.NET dynamic compilation launches csc.exe and cvtres.exe from w3wp.exe (excluded in the query)
  - Health-check or deployment scripts that an app pool runs on purpose
  - Monitoring agents that wrap the web server process
tuning: >-
  Add known-good parent command lines (specific app pools or script paths) to the exclusion list, or
  move them to a watchlist in Sentinel. Run over 30 days first to baseline.
triage:
  - Check the parent command line for the app pool or site name, then find the web request that matches the process start time in IIS or proxy logs.
  - Look for a new or recently modified .aspx, .ashx, .jsp or .php file in the web root around that time.
  - Review the child command line for discovery (whoami, net, nltest), download (certutil, bitsadmin, curl) or encoded PowerShell.
  - If confirmed, isolate the server, preserve the web root and logs, and hunt for the same file hash or command pattern on other servers.
validated: syntax
