id: TH-2026-0002
title: Drupal installer abuse on Linux web servers
date: '2026-11-26'
author: Jose (R0Liii)
status: experimental
severity: critical
platforms:
- defender-xdr
- sentinel
tables:
- DeviceFileEvents
- DeviceProcessEvents
attack:
  tactics:
  - TA0001
  - TA0003
  - TA0002
  techniques:
  - T1190
