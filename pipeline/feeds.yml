# Threat intel sources the Collector polls. Feeds that fail are logged and skipped.
#
# kind tells triage what a source is, so hunts follow attacker behavior and not just CVEs:
#   research  - intrusion write-ups, campaign and malware analysis (best hunts come from these)
#   advisory  - government advisories, often full of TTPs (CISA joint advisories)
#   kev       - CISA Known Exploited Vulnerabilities (confirmed exploitation, CVE only)
#   news      - security news; useful for what is happening now, lower trust
# weight raises an item's triage priority (1.0 = neutral).
# Set publishable: false on a research-only source (see source_policy.yml): agents may use it
# as a lead but must find a publishable source before drafting a hunt.
# Feed addresses move; when one goes quiet, check it (last verified 2026-11-26).
kev:
  name: CISA Known Exploited Vulnerabilities
  url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  kind: kev
  weight: 0.8
rss:
  # Government advisories
  - name: CISA Cybersecurity Advisories
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    kind: advisory
    weight: 2.2
  # Threat research: intrusions, campaigns, malware, attacker tradecraft
